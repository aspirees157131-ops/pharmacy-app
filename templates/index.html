<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель Управления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; padding: 12px; margin: 0; color: #333; }
        .nav { display: flex; gap: 8px; margin-bottom: 15px; }
        .nav button { flex: 1; padding: 12px; border: none; background: #e0e0e0; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .nav button.active { background: #0088cc; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h2 { font-size: 16px; margin-top: 0; color: #0088cc; }
        label { font-size: 13px; color: #555; display: block; margin-top: 10px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; }
        button.btn-submit { width: 100%; background: #0088cc; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        button.btn-excel { width: 100%; background: #27ae60; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        button:active { opacity: 0.7; transform: scale(0.98); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #f0f0f0; }
        #status-msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; text-align: center; font-weight: bold; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="nav">
        <button id="btn-form" class="active" type="button" onclick="switchTab('form')">📝 Ввод</button>
        <button id="btn-report" type="button" onclick="switchTab('report')">📊 Отчеты</button>
    </div>

    <div id="status-msg"></div>

    <!-- Вкладка Ввода -->
    <div id="tab-form" class="tab-content active">
        <div class="card">
            <h2>👥 Кадры и Дисциплина</h2>
            <label>Филиал №</label>
            <select id="staff_branch">
                <option value="1">Филиал 1</option><option value="2">Филиал 2</option>
                <option value="3">Филиал 3</option><option value="4">Филиал 4</option>
                <option value="5">Филиал 5</option><option value="6">Филиал 6</option>
                <option value="7">Филиал 7</option><option value="8">Филиал 8</option>
            </select>

            <label>Сотрудник</label>
            <input type="text" id="staff_name" placeholder="ФИО сотрудника">

            <label>Тип записи</label>
            <select id="log_type">
                <option value="Косяк/Нарушение">Косяк / Нарушение</option>
                <option value="Опоздание">Опоздание</option>
                <option value="Уход раньше">Уход раньше</option>
            </select>

            <label>Детали / Описание</label>
            <textarea id="staff_details" rows="2" placeholder="Описание..."></textarea>

            <button class="btn-submit" type="button" onclick="sendStaffLog()">Зафиксировать</button>
        </div>

        <div class="card">
            <h2>💰 Финансы и Акционные</h2>
            <label>Филиал №</label>
            <select id="fin_branch">
                <option value="1">Филиал 1</option><option value="2">Филиал 2</option>
                <option value="3">Филиал 3</option><option value="4">Филиал 4</option>
                <option value="5">Филиал 5</option><option value="6">Филиал 6</option>
                <option value="7">Филиал 7</option><option value="8">Филиал 8</option>
            </select>

            <label>Тип операции</label>
            <select id="trans_type">
                <option value="Приход (Акция)">Приход (Акционные)</option>
                <option value="Расход">Расход</option>
            </select>

            <label>Сумма</label>
            <input type="number" id="amount" placeholder="0.00">

            <label>Категория / Источник</label>
            <input type="text" id="category" placeholder="Бренд / Хоз.нужды">

            <label>Комментарий</label>
            <input type="text" id="fin_comment" placeholder="Детали...">

            <button class="btn-submit" type="button" onclick="sendFinance()">Сохранить транзакцию</button>
        </div>
    </div>

    <!-- Вкладка Отчетов -->
    <div id="tab-report" class="tab-content">
        <button class="btn-excel" type="button" onclick="sendExcelToTelegram()">📩 Отправить Excel в чат Telegram</button>

        <div class="card">
            <h2>Последние нарушения</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Дата</th><th>Фил.</th><th>Кто</th><th>Тип</th><th>Детали</th></tr></thead>
                    <tbody id="staff-table"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Последние финансы</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Дата</th><th>Фил.</th><th>Тип</th><th>Сумма</th><th>Кат.</th></tr></thead>
                    <tbody id="finance-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function showMessage(text, isError = false) {
            const msgBox = document.getElementById('status-msg');
            msgBox.innerText = text;
            msgBox.className = isError ? 'status-error' : 'status-success';
            msgBox.style.display = 'block';
            setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
            if (tg && tg.showAlert) {
                tg.showAlert(text);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));

            if (tab === 'form') {
                document.getElementById('tab-form').classList.add('active');
                document.getElementById('btn-form').classList.add('active');
            } else {
                document.getElementById('tab-report').classList.add('active');
                document.getElementById('btn-report').classList.add('active');
                loadReports();
            }
        }

        function loadReports() {
            fetch('/api/get_reports')
                .then(res => res.json())
                .then(data => {
                    let staffHtml = '';
                    if (data.staff) {
                        data.staff.forEach(r => {
                            staffHtml += `<tr><td>${r[4] || ''}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
                        });
                    }
                    document.getElementById('staff-table').innerHTML = staffHtml;

                    let finHtml = '';
                    if (data.finance) {
                        data.finance.forEach(r => {
                            finHtml += `<tr><td>${r[5] || ''}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
                        });
                    }
                    document.getElementById('finance-table').innerHTML = finHtml;
                })
                .catch(err => showMessage("Ошибка загрузки отчетов: " + err, true));
        }

        function sendExcelToTelegram() {
            const chatId = tg?.initDataUnsafe?.user?.id;
            if (!chatId) {
                showMessage("Ошибка: Не удалось определить ваш Telegram ID (запустите через бота)", true);
                return;
            }
            fetch('/api/send_excel_telegram', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: chatId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    showMessage("✅ Отчёт успешно отправлен в ваш чат с ботом!");
                } else {
                    showMessage("Ошибка при отправке файла: " + (data.message || ''), true);
                }
            })
            .catch(err => showMessage("Ошибка запроса: " + err, true));
        }

        function sendStaffLog() {
            const data = {
                branch: document.getElementById('staff_branch').value,
                staff_name: document.getElementById('staff_name').value,
                log_type: document.getElementById('log_type').value,
                details: document.getElementById('staff_details').value
            };
            fetch('/api/add_staff_log', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                showMessage('Запись нарушений сохранена!');
                document.getElementById('staff_details').value = '';
            })
            .catch(err => showMessage("Ошибка сохранения: " + err, true));
        }

        function sendFinance() {
            const data = {
                branch: document.getElementById('fin_branch').value,
                trans_type: document.getElementById('trans_type').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                comment: document.getElementById('fin_comment').value
            };
            fetch('/api/add_finance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                showMessage('Финансовая запись сохранена!');
                document.getElementById('amount').value = '';
                document.getElementById('fin_comment').value = '';
            })
            .catch(err => showMessage("Ошибка сохранения: " + err, true));
        }
    </script>
</body>
</html>
